name: PeopleOps HRIS CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Static checks, unit tests and builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install with frozen lockfile
        run: bun install --frozen-lockfile
      - name: Static quality
        run: bun run check
      - name: Tests
        run: |
          bun run test
          bun run test:structure
      - name: Production builds
        run: bun run build

  postgres-integration:
    name: PostgreSQL and migration rehearsal
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: peopleops
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: peopleops_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U peopleops -d peopleops_test"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      CI: "true"
      TEST_DATABASE_URL: postgresql://peopleops:ci-only-password@127.0.0.1:5433/peopleops_test
      DATABASE_URL: postgresql://peopleops:ci-only-password@127.0.0.1:5433/peopleops_dev
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install with frozen lockfile
        run: bun install --frozen-lockfile
      - name: Isolated migration and DB integration
        run: bun run test:integration
