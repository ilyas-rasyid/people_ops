name: peopleops-local

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: peopleops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: peopleops_dev
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - peopleops-postgres:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peopleops -d peopleops_dev"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  peopleops-postgres:
