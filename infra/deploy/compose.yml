name: peopleops-demo
services:
  web:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.web
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?HTTPS domain required}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - caddy_data:/data
      - caddy_config:/config
  api:
    build:
      context: ../..
      dockerfile: infra/deploy/Dockerfile.api
    environment:
      APP_ENV: production
      API_PORT: 3001
      DATABASE_URL: postgresql://peopleops:${POSTGRES_PASSWORD:?Missing secret}@postgres:5432/peopleops
      SESSION_SECRET: ${SESSION_SECRET:?Missing secret}
      ALLOWED_ORIGIN: https://${SITE_ADDRESS:?Missing domain}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3001/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: peopleops
      POSTGRES_DB: peopleops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peopleops -d peopleops"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
